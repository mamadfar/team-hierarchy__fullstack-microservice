# ============================================================================
# CI — lint, typecheck, unit tests, build, integration tests, docker builds.
# ALWAYS runs with MOCK_CONFLUENCE=true: CI never touches real Confluence or
# Anthropic and never references production secrets.
# ============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MOCK_CONFLUENCE: "true"
  EMBEDDING_PROVIDER: mock

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `version` intentionally omitted: the action reads the pinned pnpm 11.x
      # from the "packageManager" field in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dependents resolve @orbit/shared from its compiled dist — build it first
      - name: Build shared package
        run: pnpm --filter @orbit/shared run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build all packages
        run: pnpm run build

  integration:
    name: Integration tests (postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
      REDIS_URL: redis://localhost:6379
      MOCK_CONFLUENCE: "true"
      SYNC_APP_TOKEN: dev-sync-token
      SEED_PATH: ${{ github.workspace }}/infra/db/seed/registry.json
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # service containers cannot mount infra/db/init — mirror 01-extensions.sql
      - name: Create pgvector extension
        run: PGPASSWORD=orbit psql -h localhost -U orbit -d orbit -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Build shared package
        run: pnpm --filter @orbit/shared run build

      - name: Integration tests
        run: pnpm run test:integration

  docker:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: infra/docker/web.Dockerfile
          - app: registry-service
            dockerfile: infra/docker/registry-service.Dockerfile
          - app: assistant-service
            dockerfile: infra/docker/assistant-service.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # build only — images are pushed exclusively by deploy.yml
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: orbit/${{ matrix.app }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.app }}
